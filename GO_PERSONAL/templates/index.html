<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User CRUD</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>User Management</h1>

    <h2>Add User</h2>
    <form action="/users" method="post" class="form-row">
        <input type="text" name="name" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Add User</button>
    </form>

    <h2>Users List</h2>
    <div class="table-wrap">
    <table>
        <thead>
            <tr><th>ID</th><th>Username</th><th>Password (hash)</th><th>Actions</th></tr>
        </thead>
        <tbody>
            {{range .Users}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Username}}</td>
                <td>{{.PasswordHash}}</td>
                <td class="actions">
                    <a class="btn-ghost small" href="/users/edit/{{.ID}}">Edit</a>
                    <form action="/users/delete/{{.ID}}" method="post" style="display:inline;">
                        <button class="btn-danger small" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    </div>

    <p class="small-muted">Nota: las contraseñas se guardan sin hash (temporal).</p>
</div>
</body>
</html>
